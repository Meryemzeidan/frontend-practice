<!DOCTYPE html>
<html>
  <head>
    <title>Animated card</title>
    <style>
      .card{ 
        width:200px;
        height:120px;
        background-color: lightblue;
        border:2px solid black;
        border-radius:15px;
        padding: 20px;
        transition: background-color 5s;
        
        /* transition makes css change happen smoothly instead of instantly*/
        /* transition : property duration */
        /* :hover selector applies styles when the mouse is over an element*/
    /*button:hover{
        background-color:purple;
    }
       .....  */
      }
      .card:hover{
        background-color: purple;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>My Card</h3>
      <p>this card changes color when you hover.</p>
      </div>
  <button class="card">click me</button>
  </body>
</html>
