<!DOCTYPE html>
<html>
  <head>
    <title>Position Challenge</title>
    <style>
      .card {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px;
       background-color: purple;
       color:white;
       border: none;
       border-radius:10px ;
      }
    /* position used to control where elements appear on a webpage */
      /* static -> it's default, element stays in its normal place */
      /* relative -> move an element relative to where it normallly is */
      /* absolute -> place an element at an exact position */
      /* fixed -> keeps an elment in the same place evem when u scroll */
    </style>
  </head> 
  <body>
    <button class="card">Help</button>
    <p>hi everyone</p>
  </body>
</html>
