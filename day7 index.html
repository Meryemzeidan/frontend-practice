<!DOCTYPE html>
<html>
<head>
  <title>My Profile Card</title>
  <style>
    .profile {
      width:300px;
      height: 250px;
      background-color: lightgrey;
      border:2px solid black;
      border-radius:20px;
      padding:20px;
    }
    h2{
      color:purple;
      font-family:arial;
      font-weight:bold;
    }
    p{
      font-family: Georgia;
      font-style:italic;
    }
  </style>
</head>
<body>
  <div class="profile">
    <h2>My profile card</h2>
    <p>Hi everyone ,i'm meru</p>
    <ul>
      <li>pasta</li>
      <li>rice</li>
      <li>makorona</li>
    </ul>
  </div>
</body>
  <!-- font-style make it italic -->
  <!-- font-family changes the type of text like arial,verdana,georgia,times new roman-->
    
    <!-- font weight used for bold or normal -->
  <!-- width sets how wide an element is -->
    <!-- height sets how tall an element is-->
    <!-- border radius make the cornes rounded -->
</html>
