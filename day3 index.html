<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>

<body>
<!-- <table> used to create table.
  <tr> every row start with it.
  <th> usually the 1st row & it's bold by default.
  <td> normal data inside the table. -->
    <h1>Registration Form</h1>

    <form>
<!-- used to collect information from users-->
        <label>Name:</label>
      <!--  tells the user what to enter-->
        <input type="text" placeholder="Enter your name">
<!-- input- user type information
      placeholder used to show a hint inside the box.-->
        <br><br>

        <label>Age:</label>
        <input type="number" placeholder="Enter your age">
<!-- only number can enter-->
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter your password">
<!--password in the type make characters hidden-->
        <br><br>

        <button>Submit</button>
<!--used to create button-->
    </form>

</body>
</html>
