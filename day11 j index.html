<!DOCTYPE html>
<html>
  <head>
    <title>array methods</title>
  </head>
  <body>
    <script>
      let food = ["pasta","burger","makren"];
      food.push("banana");
      // to add to the end
      food.pop();
      // removes from the end 
      console.log(food.includes("injera"));
     // checks whether an item exists
      console.log(food.indexOf("pasta"));
      // to find an item's position
      console.log(food);
    </script>
  </body>
</html>
