    <script>
      let me = {
        name:"meru",
        age:20,
        department:"software"
      }
      
      console.log(me.name);
       // to print value
      me.age = 21;
      // change age

      // add variable

      //print all
    </script>
    <!--  object stores related information as key-value pairs.
    
    let student = {
  name: "Meru",
  age: 20,
  department: "Software"
       };      
    
    console.log(student.name);
    or 
    console.log(student["age"]);-->
    
    <!-- to change value

    <!-- to add student.department="software"; -->
    
    <!-- • key:the name of property
    
    • value : the information stored under the key .
