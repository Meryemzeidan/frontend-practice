<!DOCTYPE html>
<html>
  <head>
    <title>My CSS Card</title>
    <style>
    <!--  css selecter tell which html to style-->
      #title {color:purple;
              text-align:center;}
   .card{ background-color:lightgrey;              border:2px solid black;
              padding:20px;
              margin:30px;
            }
      <!-- borders go around element -->
      <!-- padding is space inside the border -->
      <!-- margin is the space outside the border -->
      ul {
        color:blue;
        }
     <!-- this called internal css -->
    </style>
  </head>
  <body>
    <h1 id ="title">welcome</h1>
    <!-- for one unique element -->
   <div class="card">
     <!-- class used multiple elements should have the same style -->
    <p>hi, i'm meru</p>
    <ul>
      <li>learning</li>
      <li>drawing</li>
      <li>watching movie</li>
    </ul>
    </div>
  </body>
</html>
