<!DOCTYPE html>
<html>
  <head>
    <title>My Skills</title>
    <!-- flexbox is arrange item in row or column easily -->
    <!-- display:flex; -->
    <!-- justify-content control horizontal alignment, it has by default (flex-start)
    &  also center,flex-end,space-between -->
    <style>
      .container{
        display:flex;
        justify-content: space-between;
        align-items:center;
        gap :20px;
        }
        .box{
        width:300px;
        height: 200px;
        background-color: lightgrey;
        border:2px solid black;
        border-radius: 15px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <h3>what is skill</h3>
        <p>in this part i'm going to talk about skill</p>
    
      </div>
      <div class="box">
        <h3>diffrent skill</h3>
        <p>in this i'm going to talk about diffrent skill </p>
      </div>
      <div class="box">
        <h3>about my skill</h3>
        <p>in this part i'm going to talk about my skill</p>
      </div>
    </div>
    <!-- align-item control vertical alignment -->
    <!-- gap is space between items -->
  </body>
  </html>
