<!DOCTYPE html>
<html>
  <head>
    <title>Modern Botton</title>
    <style>
      .mode{
        background-color: blue;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 10px;
        transition: all 5s;
      }
      .mode:hover{
        background-color: red;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <button class="mode">Click Me</button>
  </body>
</html>
